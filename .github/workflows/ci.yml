name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Smoke-test the production bundle
        run: |
          NODE_ENV=production PORT=4321 node dist/server.cjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4321/api/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- /api/health ---"
          curl -fsS http://localhost:4321/api/health
          echo
          echo "--- anonymous access must be rejected ---"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4321/api/user/profile)
          echo "GET /api/user/profile without auth -> $STATUS"
          kill $SERVER_PID
          if [ "$STATUS" != "401" ]; then
            echo "::error::Expected 401 for anonymous request, got $STATUS"
            exit 1
          fi
