name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Smoke-test the production bundle
        run: |
          NODE_ENV=production PORT=4321 node dist/server.cjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4321/api/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- /api/health ---"
          curl -fsS http://localhost:4321/api/health
          echo
          echo "--- anonymous access must be rejected ---"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4321/api/user/profile)
          echo "GET /api/user/profile without auth -> $STATUS"
          kill $SERVER_PID
          if [ "$STATUS" != "401" ]; then
            echo "::error::Expected 401 for anonymous request, got $STATUS"
            exit 1
          fi

  bun-dev-smoke:
    name: Bun lockfile & dev startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install locked dependencies with Bun
        run: bun install --frozen-lockfile
      - name: Verify PDF extraction
        run: npm test -- tests/extraction.test.ts
      - name: Smoke-test the development server
        run: |
          LEARNCO_DB_FILE="$RUNNER_TEMP/learnco-bun-smoke.json" npm run dev -- --port 4322 --host 0.0.0.0 > "$RUNNER_TEMP/learnco-dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4322/__aistudio_internal_control_plane/dev/status > /dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/learnco-dev.log"
          if [ "$ready" != 1 ]; then
            echo "::error::Development server did not become ready"
            exit 1
          fi
          curl -fsS http://127.0.0.1:4322/ > /dev/null
